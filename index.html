<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baritone Ukulele Tuner</title>
<!-- Groovy 60s font from Google Fonts. Needs internet; falls back to Georgia if offline. -->
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #fff4d6;
    --muted: #f3c9ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    /* Slowly shifting swirl of purple, magenta and orange */
    background: linear-gradient(135deg, #1b0638, #5a0f7a, #b01e6e, #e8662d, #5a0f7a, #1b0638);
    background-size: 400% 400%;
    animation: drift 30s ease infinite;
  }
  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  header { padding: 1rem 1.5rem 0; text-align: center; }
  h1 {
    margin: 0;
    font-family: Shrikhand, Georgia, serif;
    font-weight: normal;
    font-size: 2.2rem;
    color: #ffe14d;
    text-shadow: 3px 3px 0 #ff3d81, 6px 6px 0 #2ee6c5;
  }
  #status { margin: 0.8rem 0 0; color: var(--muted); min-height: 1.4em; }
  canvas { flex: 1; width: 100%; display: block; touch-action: manipulation; }
  footer { padding: 0 1.5rem 1.2rem; display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap; }
  button {
    font-family: Shrikhand, Georgia, serif; font-size: 1rem;
    color: #1b0638; background: #ffe14d;
