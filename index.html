<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baritone Ukulele Tuner</title>
<style>
  :root {
    --bg: #10232b;
    --text: #e9efe9;
    --muted: #9bb0b0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
  }
  header { padding: 1.2rem 1.5rem 0; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: normal; }
  #status { margin: 0.3rem 0 0; color: var(--muted); min-height: 1.4em; }
  canvas { flex: 1; width: 100%; display: block; touch-action: manipulation; }
  footer { padding: 0 1.5rem 1.2rem; display: flex; gap: 1rem; align-items: center; }
  button {
    font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--muted); border-radius: 6px; padding: 0.4rem 1rem; cursor: pointer;
  }
  button:hover { border-color: var(--text); }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  footer span { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
  <header>
    <h1>Baritone ukulele tuner</h1>
    <p id="status">Click a circle or press 1–4 to hear that string.</p>
  </header>

  <canvas id="stage" aria-label="Four circles, one for each baritone ukulele string"></canvas>

  <footer>
    <button id="stop">Stop and clear</button>
    <span>Keys: 1 D, 2 G, 3 B, 4 E (or press the letter)</span>
  </footer>

<script>
// ---- The four strings of a baritone ukulele (lowest to highest) ----
const STRINGS = [
  { name: "D", label: "4th string, D3", freq: 146.83, color: "#e8a33d", key: "1" },
  { name: "G", label: "3rd string, G3", freq: 196.00, color: "#e4705a", key: "2" },
  { name: "B", label: "2nd string, B3", freq: 246.94, color: "#6fc2a8", key: "3" },
  { name: "E", label: "1st string, E4", freq: 329.63, color: "#a78bd6", key: "4" },
];

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

let audio = null;                 // created on first click (browsers block sound before that)
const voices = new Array(4).fill(null);   // the sound currently playing for each string
const active = new Array(4).fill(null);   // { until, next } while a string is "ringing"
let ripples = [];

const NOTE_SECONDS = 3;

// ---- Layout: four circles in a row, bigger for lower notes ----
function layout() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function position(i) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const base = Math.min(w / 11, h / 5, 80);
  return { x: (w * (i + 1)) / 5, y: h / 2, r: base * (1 - i * 0.12) };
}
window.addEventListener("resize", layout);
layout();

// ---- Sound ----
function ensureAudio() {
  if (audio) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) {
    statusEl.textContent = "This browser can't play sound. Try a current Chrome, Firefox or Safari.";
    return false;
  }
  audio = new AC();
  return true;
}

function stopVoice(i) {
  const v = voices[i];
  if (!v) return;
  const t = audio.currentTime;
  v.gain.gain.cancelScheduledValues(t);
  v.gain.gain.setValueAtTime(v.gain.gain.value, t);
  v.gain.gain.linearRampToValueAtTime(0, t + 0.05);   // short fade avoids a click
  v.osc.stop(t + 0.06);
  voices[i] = null;
}

function playString(i) {
  if (!ensureAudio()) return;
  if (audio.state === "suspended") audio.resume();

  stopVoice(i);   // repeated clicks restart the note cleanly instead of stacking

  const s = STRINGS[i];
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = "triangle";
  osc.frequency.value = s.freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.4, t + 0.02);                 // quick attack
  gain.gain.exponentialRampToValueAtTime(0.001, t + NOTE_SECONDS);  // slow fade, like a plucked string
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + NOTE_SECONDS + 0.1);
  voices[i] = { osc, gain };

  const now = performance.now();
  active[i] = { until: now + NOTE_SECONDS * 1000, next: now };
  statusEl.textContent = `Playing ${s.name} (${s.label}, ${s.freq} Hz). Tune your string until it sounds the same.`;
}

function stopAll() {
  if (audio) for (let i = 0; i < 4; i++) stopVoice(i);
  active.fill(null);
  ripples = [];
  statusEl.textContent = "Stopped. Click a circle or press 1–4 to hear a string.";
}

// ---- Input ----
canvas.addEventListener("pointerdown", (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  for (let i = 0; i < 4; i++) {
    const p = position(i);
    if (Math.hypot(mx - p.x, my - p.y) <= p.r * 1.3) { playString(i); return; }
  }
  statusEl.textContent = "Click directly on a circle to play a string.";
});

canvas.addEventListener("pointermove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const over = STRINGS.some((_, i) => {
    const p = position(i);
    return Math.hypot(mx - p.x, my - p.y) <= p.r * 1.3;
  });
  canvas.style.cursor = over ? "pointer" : "default";
});

window.addEventListener("keydown", (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const i = STRINGS.findIndex((s) => s.key === k || s.name.toLowerCase() === k);
  if (i >= 0) playString(i);
});

document.getElementById("stop").addEventListener("click", stopAll);

// ---- Visuals: higher notes ripple faster, with thinner rings ----
function spawnRipple(i) {
  const p = position(i), s = STRINGS[i];
  ripples.push({
    x: p.x, y: p.y, r: p.r, color: s.color,
    speed: s.freq * 0.9,                 // pixels per second: low = slow, high = fast
    width: 9 - i * 2,                    // low = thick, high = thin
    alpha: 0.9,
  });
}

let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000;
  last = now;

  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // Ringing strings emit ripples at a rate set by their pitch
  for (let i = 0; i < 4; i++) {
    const a = active[i];
    if (!a) continue;
    if (now >= a.until) { active[i] = null; continue; }
    if (now >= a.next) {
      spawnRipple(i);
      a.next += 700 * (STRINGS[0].freq / STRINGS[i].freq);   // D every 700 ms, E about every 310 ms
    }
  }

  // Draw and age ripples
  ripples = ripples.filter((rp) => rp.alpha > 0.01);
  for (const rp of ripples) {
    rp.r += rp.speed * dt;
    rp.alpha *= Math.pow(0.35, dt);      // fade out
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
    ctx.strokeStyle = rp.color;
    ctx.globalAlpha = rp.alpha;
    ctx.lineWidth = rp.width;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Draw the four string circles on top
  for (let i = 0; i < 4; i++) {
    const p = position(i), s = STRINGS[i];
    const ringing = active[i] !== null;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (ringing ? 1.08 : 1), 0, Math.PI * 2);
    ctx.fillStyle = s.color;
    ctx.globalAlpha = ringing ? 1 : 0.8;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#10232b";
    ctx.font = `${Math.round(p.r * 0.9)}px Georgia, serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(s.name, p.x, p.y + 2);
    ctx.fillStyle = "#9bb0b0";
    ctx.font = "14px Georgia, serif";
    ctx.fillText(s.label, p.x, p.y + p.r + 28);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
